<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>My Saved Files — Luna</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Segoe UI,
        Arial;

    background:
        radial-gradient(
            circle at 20% 0,
            #20285b,
            #080b18 45%,
            #050711
        );

    color: #eef2ff;

    min-height: 100vh;
}

.wrap {

    width: min(1050px,92%);

    margin: auto;

    padding:
        30px 0 60px;
}

.top {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 12px;
}

.logo {

    width: 48px;
    height: 48px;

    border-radius: 15px;

    display: grid;

    place-items: center;

    background:
        linear-gradient(
            135deg,
            #7c5cff,
            #00d4ff
        );

    font-weight: 900;

    font-size: 22px;
}

.back {

    border: 0;

    border-radius: 11px;

    padding:
        11px 15px;

    color: white;

    cursor: pointer;

    background:
        #ffffff0d;
}

.grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(260px,1fr)
        );

    gap: 16px;
}

.file {

    background:
        #ffffff08;

    border:
        1px solid #ffffff12;

    border-radius: 17px;

    padding: 18px;

    transition: .2s;
}

.file:hover {

    transform:
        translateY(-3px);

    background:
        #ffffff0d;
}

.file h3 {

    margin:
        10px 0 8px;
}

.meta {

    font-size: 12px;

    color: #8996b8;

    margin-bottom: 16px;
}

.preview {

    color: #aeb9d5;

    line-height: 1.5;

    min-height: 55px;

    white-space: pre-wrap;

    overflow: hidden;
}

.actions {

    display: flex;

    gap: 8px;

    margin-top: 15px;
}

.open {

    background:
        linear-gradient(
            135deg,
            #7c5cff,
            #00bfff
        );

    color: white;

    border: 0;

    border-radius: 10px;

    padding: 10px;

    flex: 1;

    cursor: pointer;
}

.delete {

    background:
        #ffffff0d;

    color: #ff7897;

    border: 0;

    border-radius: 10px;

    padding:
        10px 13px;

    cursor: pointer;
}

.pill {

    font-size: 12px;

    padding:
        5px 8px;

    border-radius: 20px;

    background:
        #7c5cff22;

    color:
        #a99cff;
}

.empty {

    text-align: center;

    border:
        1px dashed #ffffff20;

    padding: 55px 20px;

    border-radius: 18px;

    color: #8793b2;
}

</style>

</head>

<body>

<div class="wrap">

<div class="top">

<div class="brand">

<div class="logo">
L
</div>

<div>

<h1 style="margin:0">
My Saved Files
</h1>

<small style="color:#8e9abb">
Luna Storage
</small>

</div>

</div>


<button
class="back"
onclick="location.href='index.html'">

? New Note

</button>

</div>


<div id="list">
</div>

</div>


<script>

/* Get Luna files */

function getFiles() {

    return JSON.parse(
        localStorage.getItem(
            'lunaFiles'
        ) || '[]'
    );

}


/* Protect HTML output */

function escapeHTML(text) {

    return String(text)
        .replace(
            /[&<>"']/g,
            function(match) {

                return {

                    '&':'&amp;',
                    '<':'&lt;',
                    '>':'&gt;',
                    '"':'&quot;',
                    "'":'&#039;'

                }[match];

            }
        );

}


/* Display files */

function render() {

    let files =
        getFiles();


    if (!files.length) {

        list.innerHTML = `

        <div class="empty">

            ??

            <h2>
                No Luna files yet
            </h2>

            <p>
                Create a note and save it
                to Luna Storage.
            </p>

        </div>

        `;

        return;

    }


    list.innerHTML =

        '<div class="grid">' +

        files
        .slice()
        .reverse()
        .map(

            file => `

            <article class="file">

                <span class="pill">

                    ${
                        file.password
                        ? '?? Protected'
                        : '?? No password'
                    }

                </span>


                <h3>
                    ${escapeHTML(file.title)}
                </h3>


                <div class="meta">

                    ${
                        new Date(
                            file.updated
                        ).toLocaleString()
                    }

                </div>


                <div class="preview">

                    ${
                        escapeHTML(
                            file.content
                                .slice(0,180)
                        )
                    }

                    ${
                        file.content.length > 180
                        ? '…'
                        : ''
                    }

                </div>


                <div class="actions">

                    <button
                        class="open"
                        onclick="
                        openFile('${file.id}')
                        ">

                        Open

                    </button>


                    <button
                        class="delete"
                        onclick="
                        trash('${file.id}')
                        ">

                        ??

                    </button>

                </div>

            </article>

            `

        ).join('') +

        '</div>';

}


/* Open a file */

function openFile(id) {

    let files =
        getFiles();


    let file =
        files.find(
            item => item.id === id
        );


    if (!file)
        return;


    if (file.password) {

        let password =
            prompt(
                'Enter password for "' +
                file.title +
                '":'
            );


        if (
            password !==
            file.password
        ) {

            alert(
                'Incorrect password.'
            );

            return;

        }

    }


    localStorage.setItem(

        'lunaDraft',

        JSON.stringify({

            title:
                file.title,

            content:
                file.content

        })

    );


    location.href =
        'index.html';

}


/* Move to recycle bin */

function trash(id) {

    let files =
        getFiles();


    let index =
        files.findIndex(
            item => item.id === id
        );


    if (index < 0)
        return;


    if (
        !confirm(
            'Move this file to Recycle Bin?'
        )
    )
        return;


    let file =
        files.splice(
            index,
            1
        )[0];


    let trash =
        JSON.parse(
            localStorage.getItem(
                'lunaTrash'
            ) || '[]'
        );


    file.deleted =
        new Date().toISOString();


    trash.push(file);


    localStorage.setItem(
        'lunaFiles',
        JSON.stringify(files)
    );


    localStorage.setItem(
        'lunaTrash',
        JSON.stringify(trash)
    );


    render();

}


render();

</script>

</body>

</html>
