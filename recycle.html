<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Recycle Bin — Luna</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Segoe UI,
        Arial;

    background:
        radial-gradient(
            circle at 20% 0,
            #252050,
            #080b18 45%,
            #050711
        );

    color: #eef2ff;

    min-height: 100vh;
}

.wrap {

    width: min(1000px,92%);

    margin: auto;

    padding:
        30px 0;
}

.top {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 25px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 12px;
}

.logo {

    width: 48px;
    height: 48px;

    border-radius: 15px;

    display: grid;

    place-items: center;

    background:
        linear-gradient(
            135deg,
            #7c5cff,
            #00d4ff
        );

    font-weight: 900;
}

.back,
.emptybtn,
.restore,
.del {

    border: 0;

    border-radius: 10px;

    padding:
        11px 14px;

    cursor: pointer;

    color: white;
}

.back {

    background:
        #ffffff0c;
}

.emptybtn {

    background:
        #ff527722;

    color:
        #ff8fa7;
}

.toolbar {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 15px;
}

.list {

    display: grid;

    gap: 12px;
}

.row {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    gap: 15px;

    padding: 17px;

    background:
        #ffffff08;

    border:
        1px solid #ffffff12;

    border-radius: 15px;
}

.row h3 {

    margin:
        0 0 5px;
}

.meta {

    font-size: 12px;

    color: #8793b3;
}

.buttons {

    display: flex;

    gap: 7px;
}

.restore {

    background:
        #ffffff0c;
}

.del {

    background:
        #ff527733;

    color:
        #ff91a8;
}

.empty {

    text-align: center;

    padding: 60px;

    border:
        1px dashed #ffffff20;

    border-radius: 18px;

    color: #8793b2;
}

</style>

</head>

<body>

<div class="wrap">


<div class="top">

<div class="brand">

<div class="logo">
L
</div>

<div>

<h1 style="margin:0">
Recycle Bin
</h1>

<small style="color:#8e9abb">
Deleted Luna files
</small>

</div>

</div>


<button
class="back"
onclick="location.href='index.html'">

? Luna

</button>

</div>


<div class="toolbar">

<span id="count">
</span>


<button
class="emptybtn"
onclick="emptyBin()">

Empty Recycle Bin

</button>

</div>


<div
class="list"
id="list">

</div>


</div>


<script>

/* Get deleted files */

function getTrash() {

    return JSON.parse(

        localStorage.getItem(
            'lunaTrash'
        ) || '[]'

    );

}


/* Escape HTML */

function escapeHTML(text) {

    return String(text)
        .replace(
            /[&<>"']/g,
            function(match) {

                return {

                    '&':'&amp;',
                    '<':'&lt;',
                    '>':'&gt;',
                    '"':'&quot;',
                    "'":'&#039;'

                }[match];

            }
        );

}


/* Render recycle bin */

function render() {

    let files =
        getTrash();


    count.textContent =

        files.length +
        ' file' +
        (
            files.length === 1
            ? ''
            : 's'
        );


    if (!files.length) {

        list.innerHTML = `

        <div class="empty">

            ??

            <h2>
                Recycle Bin is empty
            </h2>

            <p>
                Deleted files will
                appear here.
            </p>

        </div>

        `;

        return;

    }


    list.innerHTML =

        files
        .slice()
        .reverse()
        .map(

            file => `

            <div class="row">

                <div>

                    <h3>
                        ${escapeHTML(file.title)}
                    </h3>

                    <div class="meta">

                        Deleted

                        ${
                            new Date(
                                file.deleted
                            ).toLocaleString()
                        }

                    </div>

                </div>


                <div class="buttons">

                    <button
                        class="restore"
                        onclick="
                        restore('${file.id}')
                        ">

                        ? Restore

                    </button>


                    <button
                        class="del"
                        onclick="
                        permanent('${file.id}')
                        ">

                        Delete Forever

                    </button>

                </div>

            </div>

            `

        ).join('');

}


/* Restore file */

function restore(id) {

    let trash =
        getTrash();


    let index =
        trash.findIndex(
            file => file.id === id
        );


    if (index < 0)
        return;


    let file =
        trash.splice(
            index,
            1
        )[0];


    delete file.deleted;


    let files =
        JSON.parse(

            localStorage.getItem(
                'lunaFiles'
            ) || '[]'

        );


    files.push(file);


    localStorage.setItem(

        'lunaTrash',

        JSON.stringify(trash)

    );


    localStorage.setItem(

        'lunaFiles',

        JSON.stringify(files)

    );


    render();

}


/* Permanently delete */

function permanent(id) {

    if (

        !confirm(
            'Permanently delete this file? ' +
            'This cannot be undone.'
        )

    ) {

        return;

    }


    let trash =
        getTrash()
        .filter(
            file =>
                file.id !== id
        );


    localStorage.setItem(

        'lunaTrash',

        JSON.stringify(trash)

    );


    render();

}


/* Empty entire recycle bin */

function emptyBin() {

    let trash =
        getTrash();


    if (!trash.length)
        return;


    if (

        confirm(
            'Permanently delete everything ' +
            'in the Recycle Bin?'
        )

    ) {

        localStorage.setItem(
            'lunaTrash',
            '[]'
        );


        render();

    }

}


render();

</script>

</body>

</html>
